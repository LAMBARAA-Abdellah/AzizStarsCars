<!DOCTYPE html>
<html lang="fr" x-data="initApp()" :class="theme" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AzizStarsCars | El Jadida & Zemamra Car Rental</title>
    
    <!-- Scripts & Styles -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        premium: { black: '#0a0a0a', gold: '#D4AF37', gray: '#1a1a1a' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="assets/js/script.js"></script>
</head>
<body class="bg-white dark:bg-premium-black text-premium-black dark:text-white transition-colors duration-300 custom-scrollbar overflow-x-hidden" :dir="lang === 'ar' ? 'rtl' : 'ltr'">

    <!-- Navbar -->
    <nav :class="scrolled ? 'bg-white/95 dark:bg-premium-black/95 backdrop-blur-md py-4 shadow-lg' : 'bg-transparent py-6'" 
         class="fixed w-full z-50 transition-all duration-300 border-b border-black/5 dark:border-white/5">
        <div class="container mx-auto px-6 flex justify-between items-center">
            <a href="#" class="flex items-center space-x-2 rtl:space-x-reverse group">
                <div class="w-10 h-10 gold-gradient rounded-lg flex items-center justify-center transform group-hover:rotate-12 transition-transform">
                    <i data-lucide="star" class="text-black w-6 h-6 fill-current"></i>
                </div>
                <span class="text-2xl font-serif font-bold tracking-tighter">Aziz<span class="gold-text-gradient">Stars</span>Cars</span>
            </a>

            <!-- Desktop Menu -->
            <div class="hidden lg:flex items-center space-x-8 rtl:space-x-reverse">
                <a href="#home" class="hover:text-premium-gold transition-colors font-medium" x-text="t('nav_home')"></a>
                <a href="#about" class="hover:text-premium-gold transition-colors font-medium" x-text="t('nav_about')"></a>
                <a href="#cars" class="hover:text-premium-gold transition-colors font-medium" x-text="t('nav_cars')"></a>
                <a href="#locations" class="hover:text-premium-gold transition-colors font-medium" x-text="t('nav_locations')"></a>
                
                <!-- Language -->
                <div class="flex items-center space-x-2 rtl:space-x-reverse border-x border-black/10 dark:border-white/10 px-4">
                    <button @click="setLang('fr')" :class="lang === 'fr' ? 'text-premium-gold font-bold underline' : 'text-gray-400'" class="text-xs uppercase hover:text-premium-gold transition-colors">FR</button>
                    <button @click="setLang('en')" :class="lang === 'en' ? 'text-premium-gold font-bold underline' : 'text-gray-400'" class="text-xs uppercase hover:text-premium-gold transition-colors">EN</button>
                    <button @click="setLang('ar')" :class="lang === 'ar' ? 'text-premium-gold font-bold underline' : 'text-gray-400'" class="text-xs uppercase hover:text-premium-gold transition-colors font-arabic">عربي</button>
                </div>

                <!-- Theme Toggle -->
                <button @click="toggleTheme()" class="p-2 rounded-full hover:bg-black/5 dark:hover:bg-white/5 transition-colors">
                    <i data-lucide="sun" x-show="theme === 'dark'" class="w-5 h-5 text-premium-gold"></i>
                    <i data-lucide="moon" x-show="theme === 'light'" class="w-5 h-5 text-premium-black"></i>
                </button>

                <a href="#contact" class="gold-gradient text-black px-6 py-2.5 rounded-full font-bold hover:scale-105 transition-all shadow-lg" x-text="t('nav_contact')"></a>
            </div>

            <!-- Mobile Toggle -->
            <div class="flex items-center space-x-4 lg:hidden">
                <button @click="toggleTheme()" class="p-2 rounded-full">
                    <i data-lucide="sun" x-show="theme === 'dark'" class="w-5 h-5 text-premium-gold"></i>
                    <i data-lucide="moon" x-show="theme === 'light'" class="w-5 h-5 text-premium-black"></i>
                </button>
                <button @click="mobileMenu = !mobileMenu" class="text-premium-gold">
                    <i data-lucide="menu" x-show="!mobileMenu"></i>
                    <i data-lucide="x" x-show="mobileMenu"></i>
                </button>
            </div>
        </div>

        <!-- Mobile Menu Overlay -->
        <div x-show="mobileMenu" 
             x-transition:enter="transition ease-out duration-200"
             x-transition:enter-start="opacity-0 -translate-y-4"
             x-transition:enter-end="opacity-100 translate-y-0"
             x-transition:leave="transition ease-in duration-150"
             x-transition:leave-start="opacity-100 translate-y-0"
             x-transition:leave-end="opacity-0 -translate-y-4"
             class="lg:hidden bg-white dark:bg-premium-gray border-b border-premium-gold/20 px-6 py-8 absolute w-full shadow-2xl z-40" x-cloak>
            <div class="flex flex-col space-y-6 text-center">
                <a href="#home" @click="mobileMenu = false" class="text-xl font-bold hover:text-premium-gold" x-text="t('nav_home')"></a>
                <a href="#about" @click="mobileMenu = false" class="text-xl font-bold hover:text-premium-gold" x-text="t('nav_about')"></a>
                <a href="#cars" @click="mobileMenu = false" class="text-xl font-bold hover:text-premium-gold" x-text="t('nav_cars')"></a>
                <a href="#locations" @click="mobileMenu = false" class="text-xl font-bold hover:text-premium-gold" x-text="t('nav_locations')"></a>
                <div class="flex justify-center space-x-6 rtl:space-x-reverse pt-4 border-t border-black/5 dark:border-white/5">
                    <button @click="setLang('fr'); mobileMenu = false" :class="lang === 'fr' ? 'text-premium-gold' : 'text-gray-400'" class="font-bold">FR</button>
                    <button @click="setLang('en'); mobileMenu = false" :class="lang === 'en' ? 'text-premium-gold' : 'text-gray-400'" class="font-bold">EN</button>
                    <button @click="setLang('ar'); mobileMenu = false" :class="lang === 'ar' ? 'text-premium-gold' : 'text-gray-400'" class="font-bold">عربي</button>
                </div>
                <a href="#contact" @click="mobileMenu = false" class="gold-gradient text-black px-6 py-4 rounded-xl font-bold shadow-lg inline-block" x-text="t('nav_contact')"></a>
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <section id="home" class="relative min-h-screen flex items-center overflow-hidden pt-20">
        <div class="absolute inset-0 z-0">
            <img src="https://images.unsplash.com/photo-1542362567-b058c02b9ac1?auto=format&fit=crop&q=80&w=1920" 
                 alt="Morocco Road" class="w-full h-full object-cover animate-slow-zoom">
            <div class="absolute inset-0 hero-overlay"></div>
        </div>
        <div class="container mx-auto px-6 relative z-10">
            <div class="max-w-3xl" data-aos="fade-up">
                <h1 class="text-4xl md:text-7xl font-serif font-bold leading-tight mb-8 text-white text-start" x-html="t('hero_title')"></h1>
                <p class="text-gray-200 text-lg md:text-xl mb-10 max-w-2xl leading-relaxed text-start" x-text="t('hero_desc')"></p>
                <div class="flex flex-col sm:flex-row space-y-4 sm:space-y-0 sm:space-x-4 rtl:sm:space-x-reverse">
                    <a :href="'https://wa.me/' + phone.replace('+', '')" target="_blank" class="gold-gradient text-black px-8 py-4 rounded-full font-bold flex items-center justify-center space-x-3 rtl:space-x-reverse hover:scale-105 transition-all shadow-xl">
                        <i data-lucide="message-circle" class="w-5 h-5"></i>
                        <span x-text="t('btn_whatsapp')"></span>
                    </a>
                    <a href="#cars" class="bg-white/10 backdrop-blur-md border border-white/20 text-white px-8 py-4 rounded-full font-bold flex items-center justify-center hover:bg-white hover:text-black transition-all">
                        <span x-text="t('btn_fleet')"></span>
                    </a>
                </div>
            </div>
        </div>
    </section>

    <!-- About -->
    <section id="about" class="py-16 md:py-24 overflow-hidden">
        <div class="container mx-auto px-6 flex flex-col lg:flex-row items-center gap-10 md:gap-16">
            <div class="w-full lg:w-1/2 relative" data-aos="fade-right">
                <div class="absolute -top-6 -left-6 w-20 h-20 md:w-32 md:h-32 border-t-2 border-l-2 border-premium-gold opacity-30"></div>
                <img src="https://images.unsplash.com/photo-1449965408869-eaa3f722e40d?auto=format&fit=crop&q=80&w=800" class="rounded-2xl shadow-2xl relative z-10 w-full object-cover">
            </div>
            <div class="w-full lg:w-1/2" data-aos="fade-left">
                <h2 class="text-premium-gold font-semibold uppercase tracking-widest text-sm mb-4 text-start" x-text="t('nav_about')"></h2>
                <h3 class="text-3xl md:text-4xl font-serif font-bold mb-8 text-start" x-text="t('about_title')"></h3>
                <p class="text-gray-500 dark:text-gray-400 text-lg mb-8 leading-relaxed text-start" x-text="t('about_desc')"></p>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 text-start">
                    <div class="flex items-center space-x-3 rtl:space-x-reverse"><i data-lucide="check-circle" class="text-premium-gold"></i><span class="font-bold">Qualité Supérieure</span></div>
                    <div class="flex items-center space-x-3 rtl:space-x-reverse"><i data-lucide="map-pin" class="text-premium-gold"></i><span class="font-bold">El Jadida & Zemamra</span></div>
                </div>
            </div>
        </div>
    </section>

    <!-- Cars -->
    <section id="cars" class="py-16 md:py-24 bg-gray-50 dark:bg-premium-gray/20 transition-colors">
        <div class="container mx-auto px-6 text-center">
            <h2 class="text-premium-gold font-semibold uppercase tracking-widest text-sm mb-4" x-text="t('nav_cars')"></h2>
            <h3 class="text-3xl md:text-5xl font-serif font-bold mb-12" x-html="t('cat_title')"></h3>
            
            <div class="flex flex-wrap justify-center gap-3 md:gap-4 mb-12 md:mb-16">
                <template x-for="filter in ['all', 'economy', 'citadine', 'family']">
                    <button @click="activeFilter = filter"
                        :class="activeFilter === filter ? 'gold-gradient text-black shadow-lg' : 'bg-white dark:bg-premium-gray text-gray-400 border border-black/5 dark:border-white/10'"
                        class="px-5 md:px-8 py-2 md:py-3 rounded-full font-bold uppercase text-[9px] md:text-[10px] tracking-widest transition-all"
                        x-text="t('filter_' + filter)">
                    </button>
                </template>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 md:gap-10 text-start">
                <template x-for="car in cars" :key="car.id">
                    <div x-show="activeFilter === 'all' || activeFilter === car.cat" x-transition class="glass-card rounded-2xl overflow-hidden group hover:border-premium-gold/50 transition-all duration-500">
                        <div class="relative overflow-hidden h-56 md:h-64">
                            <img :src="car.img" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-1000">
                            <div class="absolute top-4 right-4 rtl:right-auto rtl:left-4 gold-gradient text-black px-3 py-1 rounded text-[10px] font-bold uppercase" x-text="car['type_' + lang]"></div>
                        </div>
                        <div class="p-6 md:p-8">
                            <h4 class="text-xl md:text-2xl font-bold font-serif mb-4" x-text="car.name"></h4>
                            <div class="flex justify-between items-center mb-6 md:mb-8">
                                <div class="text-2xl md:text-3xl font-bold text-premium-gold"><span x-text="car.price"></span> <span class="text-xs md:text-sm font-normal uppercase" x-text="t('price_day')"></span></div>
                                <div class="flex space-x-2 rtl:space-x-reverse text-gray-400"><i data-lucide="gauge" class="w-4 h-4"></i><i data-lucide="users" class="w-4 h-4"></i></div>
                            </div>
                            <a :href="'https://wa.me/' + phone.replace('+', '') + '?text=Bonjour, je souhaite louer la ' + car.name" target="_blank"
                               class="w-full bg-premium-black dark:bg-white text-white dark:text-black font-bold py-3 md:py-4 rounded-xl flex items-center justify-center space-x-2 rtl:space-x-reverse hover:scale-[1.02] transition-all">
                                <i data-lucide="message-circle" class="w-5 h-5"></i>
                                <span x-text="t('btn_whatsapp')"></span>
                            </a>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </section>

    <!-- Locations -->
    <section id="locations" class="py-16 md:py-24">
        <div class="container mx-auto px-6">
            <div class="text-center mb-12 md:mb-16" data-aos="fade-up">
                <h2 class="text-premium-gold font-semibold uppercase tracking-widest text-sm mb-4" x-text="t('nav_locations')"></h2>
                <h3 class="text-3xl md:text-5xl font-serif font-bold mb-6" x-html="t('locations_title')"></h3>
                <p class="text-gray-500 max-w-2xl mx-auto" x-text="t('loc_desc')"></p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 md:gap-12">
                <div class="glass-card p-8 md:p-10 rounded-3xl border-l-4 rtl:border-l-0 rtl:border-r-4 border-premium-gold" data-aos="fade-right">
                    <h4 class="text-xl md:text-2xl font-bold mb-4 text-start" x-text="t('loc_eljadida')"></h4>
                    <div class="flex items-start space-x-4 rtl:space-x-reverse text-gray-400 text-start">
                        <i data-lucide="map-pin" class="text-premium-gold mt-1 flex-shrink-0"></i>
                        <p>Centre-ville, El Jadida, Maroc</p>
                    </div>
                    <div class="mt-8 text-start">
                        <a href="#" class="text-premium-gold font-bold hover:underline inline-flex items-center space-x-2 rtl:space-x-reverse group">
                            <span>Google Maps</span>
                            <i data-lucide="arrow-right" class="w-4 h-4 group-hover:translate-x-1 transition-transform"></i>
                        </a>
                    </div>
                </div>
                <div class="glass-card p-8 md:p-10 rounded-3xl border-l-4 rtl:border-l-0 rtl:border-r-4 border-premium-gold" data-aos="fade-left">
                    <h4 class="text-xl md:text-2xl font-bold mb-4 text-start" x-text="t('loc_zemamra')"></h4>
                    <div class="flex items-start space-x-4 rtl:space-x-reverse text-gray-400 text-start">
                        <i data-lucide="map-pin" class="text-premium-gold mt-1 flex-shrink-0"></i>
                        <p>Avenue Hassan II, Zemamra, Maroc</p>
                    </div>
                    <div class="mt-8 text-start">
                        <a href="#" class="text-premium-gold font-bold hover:underline inline-flex items-center space-x-2 rtl:space-x-reverse group">
                            <span>Google Maps</span>
                            <i data-lucide="arrow-right" class="w-4 h-4 group-hover:translate-x-1 transition-transform"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Contact Section -->
    <section id="contact" class="py-16 md:py-24 bg-gray-50 dark:bg-premium-gray/10 transition-colors">
        <div class="container mx-auto px-6">
            <div class="flex flex-col lg:flex-row gap-16 md:gap-20">
                <div class="w-full lg:w-1/2" data-aos="fade-right">
                    <h2 class="text-premium-gold font-semibold uppercase tracking-widest text-sm mb-4 text-start" x-text="t('nav_contact')"></h2>
                    <h3 class="text-3xl md:text-5xl font-serif font-bold mb-8 text-start" x-html="t('contact_title')"></h3>
                    <p class="text-gray-500 text-lg mb-12 text-start" x-text="t('contact_desc')"></p>
                    <div class="space-y-6 md:space-y-8">
                        <div class="flex items-center space-x-6 rtl:space-x-reverse text-start">
                            <div class="w-12 h-12 md:w-14 md:h-14 bg-white dark:bg-premium-gray rounded-2xl flex items-center justify-center border border-black/5 dark:border-white/5 shadow-sm flex-shrink-0">
                                <i data-lucide="phone" class="text-premium-gold"></i>
                            </div>
                            <div>
                                <p class="text-gray-500 text-[10px] uppercase tracking-widest font-bold">Appelez-nous</p>
                                <p class="text-lg md:text-xl font-bold" x-text="phoneFormatted"></p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-6 rtl:space-x-reverse text-start">
                            <div class="w-12 h-12 md:w-14 md:h-14 bg-white dark:bg-premium-gray rounded-2xl flex items-center justify-center border border-black/5 dark:border-white/5 shadow-sm flex-shrink-0">
                                <i data-lucide="message-circle" class="text-premium-gold"></i>
                            </div>
                            <div>
                                <p class="text-gray-500 text-[10px] uppercase tracking-widest font-bold">WhatsApp</p>
                                <a :href="'https://wa.me/' + phone.replace('+', '')" class="text-lg md:text-xl font-bold hover:text-premium-gold transition-colors" x-text="phoneFormatted"></a>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="w-full lg:w-1/2" data-aos="fade-left">
                    <form class="glass-card p-6 md:p-10 rounded-3xl shadow-xl">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                            <div>
                                <label class="block text-xs font-bold uppercase tracking-widest text-gray-500 mb-2 text-start" x-text="t('label_name')"></label>
                                <input type="text" class="w-full bg-white dark:bg-premium-black border border-black/10 dark:border-white/10 rounded-xl px-5 py-4 focus:border-premium-gold outline-none transition-colors">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase tracking-widest text-gray-500 mb-2 text-start" x-text="t('label_email')"></label>
                                <input type="email" class="w-full bg-white dark:bg-premium-black border border-black/10 dark:border-white/10 rounded-xl px-5 py-4 focus:border-premium-gold outline-none transition-colors text-start">
                            </div>
                        </div>
                        <div class="mb-8">
                            <label class="block text-xs font-bold uppercase tracking-widest text-gray-500 mb-2 text-start" x-text="t('label_message')"></label>
                            <textarea rows="4" class="w-full bg-white dark:bg-premium-black border border-black/10 dark:border-white/10 rounded-xl px-5 py-4 focus:border-premium-gold outline-none transition-colors"></textarea>
                        </div>
                        <button type="button" class="w-full gold-gradient text-black font-bold py-4 md:py-5 rounded-2xl shadow-xl shadow-premium-gold/20 uppercase tracking-widest hover:scale-[1.01] transition-transform" x-text="t('btn_send')"></button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="py-12 border-t border-black/5 dark:border-white/5 text-center bg-gray-50 dark:bg-transparent">
        <div class="container mx-auto px-6">
            <div class="flex flex-col md:flex-row justify-between items-center gap-8 mb-8">
                <span class="text-xl font-serif font-bold">Aziz<span class="gold-text-gradient">Stars</span>Cars</span>
                <div class="flex space-x-6 rtl:space-x-reverse text-gray-400 text-sm">
                    <a href="#home" class="hover:text-premium-gold transition-colors" x-text="t('nav_home')"></a>
                    <a href="#cars" class="hover:text-premium-gold transition-colors" x-text="t('nav_cars')"></a>
                    <a href="#contact" class="hover:text-premium-gold transition-colors" x-text="t('nav_contact')"></a>
                </div>
            </div>
            <p class="text-gray-500 text-xs tracking-widest uppercase" x-html="t('footer_copy')"></p>
        </div>
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
</body>
</html>
