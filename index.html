<!DOCTYPE html>
<html lang="fr" x-data="initApp()" :class="theme" :dir="lang === 'ar' ? 'rtl' : 'ltr'">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AzizStarsCars - Premium Car Rental in El Jadida & Zemamra. Best prices and high quality service for your car rental needs in Morocco.">
    <title>AzizStarsCars | Premium Car Rental El Jadida & Zemamra</title>

    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Stylesheets -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Scripts -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/script.js"></script>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg fixed-top glass-nav" :class="scrolled ? 'py-2 shadow-sm' : 'py-3'">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <div class="gold-gradient rounded-circle d-flex align-items-center justify-content-center me-2" style="width: 40px; height: 40px;">
                    <i data-lucide="star" class="text-white" style="width: 20px; height: 20px;"></i>
                </div>
                <span class="fw-bold text-main">Aziz<span class="text-gold">Stars</span>Cars</span>
            </a>

            <button class="navbar-toggler border-0 shadow-none" type="button" @click="mobileMenu = !mobileMenu">
                <i data-lucide="menu" class="text-main" x-show="!mobileMenu"></i>
                <i data-lucide="x" class="text-main" x-show="mobileMenu"></i>
            </button>

            <div class="collapse navbar-collapse" :class="mobileMenu ? 'show' : ''" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center gap-2">
                    <li class="nav-item">
                        <a class="nav-link px-3" href="#home" x-text="t('nav_home')" @click="mobileMenu = false"></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" href="#about" x-text="t('nav_about')" @click="mobileMenu = false"></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" href="#cars" x-text="t('nav_cars')" @click="mobileMenu = false"></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" href="#pricing" x-text="t('nav_pricing') || 'Tarifs'" @click="mobileMenu = false"></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" href="#locations" x-text="t('nav_locations')" @click="mobileMenu = false"></a>
                    </li>
                    
                    <!-- Language & Theme -->
                    <li class="nav-item d-flex align-items-center mx-2 gap-1 border-start border-end px-3">
                        <button @click="setLang('fr')" class="btn btn-sm p-1 border-0" :class="lang === 'fr' ? 'text-gold fw-bold' : 'text-muted'">FR</button>
                        <button @click="setLang('en')" class="btn btn-sm p-1 border-0" :class="lang === 'en' ? 'text-gold fw-bold' : 'text-muted'">EN</button>
                        <button @click="setLang('ar')" class="btn btn-sm p-1 border-0 font-arabic" :class="lang === 'ar' ? 'text-gold fw-bold' : 'text-muted'">عربي</button>
                        
                        <button @click="toggleTheme()" class="btn btn-sm p-1 border-0 ms-2">
                            <i data-lucide="sun" x-show="theme === 'dark'" class="text-gold" style="width: 18px; height: 18px;"></i>
                            <i data-lucide="moon" x-show="theme === 'light'" class="text-main" style="width: 18px; height: 18px;"></i>
                        </button>
                    </li>

                    <li class="nav-item mt-2 mt-lg-0">
                        <a href="#contact" class="btn-premium btn-premium-gold" x-text="t('nav_contact')"></a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <header id="home" class="hero-section" style="background: url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&q=80&w=1920') center/cover no-repeat;">
        <div class="hero-overlay"></div>
        <div class="container hero-content">
            <div class="row">
                <div class="col-lg-7" data-aos="fade-right">
                    <h1 class="display-2 fw-bold mb-4" x-html="t('hero_title')"></h1>
                    <p class="fs-5 mb-5 opacity-75" x-text="t('hero_desc')"></p>
                    <div class="d-flex flex-wrap gap-3">
                        <a :href="'https://wa.me/' + phone.replace('+', '')" target="_blank" class="btn-premium btn-premium-gold">
                            <i data-lucide="message-circle"></i>
                            <span x-text="t('btn_whatsapp')"></span>
                        </a>
                        <a href="#cars" class="btn-premium btn-premium-outline">
                            <span x-text="t('btn_fleet')"></span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- About -->
    <section id="about" class="py-section">
        <div class="container">
            <div class="row align-items-center g-5">
                <div class="col-lg-6" data-aos="fade-up">
                    <div class="position-relative">
                        <img src="https://images.unsplash.com/photo-1549317661-bd32c8ce0db2?auto=format&fit=crop&q=80&w=800" alt="About AzizStarsCars" class="img-fluid rounded-lg shadow-lg">
                        <div class="position-absolute bottom-0 end-0 gold-gradient p-4 m-4 rounded-md shadow-lg d-none d-md-block text-white">
                            <span class="d-block h2 fw-bold mb-0">10+</span>
                            <span class="small text-uppercase">Années d'expérience</span>
                        </div>
                    </div>
                </div>
                <div class="col-lg-6" data-aos="fade-up" data-aos-delay="200">
                    <h6 class="text-gold text-uppercase fw-bold mb-3" x-text="t('nav_about')"></h6>
                    <h2 class="display-4 mb-4" x-text="t('about_title')"></h2>
                    <p class="text-muted fs-5 mb-4" x-text="t('about_desc')"></p>
                    <div class="row g-4 mt-2">
                        <div class="col-sm-6">
                            <div class="d-flex align-items-center gap-3">
                                <div class="gold-gradient p-2 rounded-circle">
                                    <i data-lucide="check" class="text-white" style="width: 20px; height: 20px;"></i>
                                </div>
                                <span class="fw-bold">Qualité Supérieure</span>
                            </div>
                        </div>
                        <div class="col-sm-6">
                            <div class="d-flex align-items-center gap-3">
                                <div class="gold-gradient p-2 rounded-circle">
                                    <i data-lucide="map-pin" class="text-white" style="width: 20px; height: 20px;"></i>
                                </div>
                                <span class="fw-bold">El Jadida & Zemamra</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Cars Fleet -->
    <section id="cars" class="py-section bg-light">
        <div class="container">
            <div class="text-center mb-5" data-aos="fade-up">
                <h6 class="text-gold text-uppercase fw-bold mb-3" x-text="t('nav_cars')"></h6>
                <h2 class="display-4 mb-4" x-html="t('cat_title')"></h2>
                
                <div class="d-flex flex-wrap justify-content-center gap-2 mt-4">
                    <template x-for="filter in ['all', 'economy', 'citadine', 'family']">
                        <button @click="activeFilter = filter"
                            :class="activeFilter === filter ? 'btn-premium-gold' : 'btn btn-outline-secondary'"
                            class="btn rounded-pill px-4 py-2 border-0 fw-bold text-uppercase small"
                            x-text="t('filter_' + filter)">
                        </button>
                    </template>
                </div>
            </div>

            <div class="row g-4">
                <template x-for="car in cars" :key="car.id">
                    <div x-show="activeFilter === 'all' || activeFilter === car.cat" class="col-md-6 col-lg-4" data-aos="zoom-in" :data-aos-delay="car.id * 50">
                        <div class="glass-card h-100">
                            <div class="car-image-container">
                                <img :src="car.img" :alt="car.name">
                                <div class="car-badge gold-gradient text-white" x-text="car['type_' + lang]"></div>
                            </div>
                            <div class="p-4">
                                <h4 class="mb-3" x-text="car.name"></h4>
                                <div class="d-flex justify-content-between align-items-end mb-4">
                                    <div>
                                        <span class="display-6 fw-bold text-gold" x-text="car.price"></span>
                                        <span class="text-muted ms-1" x-text="t('price_day')"></span>
                                    </div>
                                    <div class="d-flex gap-2 text-muted opacity-50">
                                        <i data-lucide="gauge" style="width: 18px; height: 18px;"></i>
                                        <i data-lucide="users" style="width: 18px; height: 18px;"></i>
                                    </div>
                                </div>
                                <a :href="'https://wa.me/' + phone.replace('+', '') + '?text=Bonjour, je souhaite louer la ' + car.name"
                                    target="_blank" class="btn-premium btn-premium-gold w-100">
                                    <i data-lucide="message-circle"></i>
                                    <span x-text="t('btn_whatsapp')"></span>
                                </a>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </section>

    <!-- Pricing -->
    <section id="pricing" class="py-section">
        <div class="container">
            <div class="text-center mb-5" data-aos="fade-up">
                <h6 class="text-gold text-uppercase fw-bold mb-3" x-text="t('nav_pricing') || 'Tarifs'"></h6>
                <h2 class="display-4 mb-4" x-html="t('promo_title')"></h2>
                <p class="text-muted fs-5" x-text="t('pricing_subtitle')"></p>
            </div>

            <div class="row g-4 align-items-stretch">
                <!-- 1 Day -->
                <div class="col-lg-4" data-aos="fade-up">
                    <div class="glass-card pricing-card h-100">
                        <h4 class="fw-bold mb-2" x-text="t('price_1day')"></h4>
                        <div class="price"><span class="text-gold">200</span> <small class="fs-6 text-muted fw-normal" x-text="t('price_day')"></small></div>
                        <ul class="list-unstyled mb-5 text-start d-inline-block mx-auto">
                            <li class="mb-3"><i data-lucide="check" class="text-gold me-2"></i> <span x-text="t('pricing_full_insurance')"></span></li>
                            <li class="mb-3"><i data-lucide="check" class="text-gold me-2"></i> <span x-text="t('pricing_unlimited_km')"></span></li>
                            <li><i data-lucide="check" class="text-gold me-2"></i> <span x-text="t('pricing_support_24')"></span></li>
                        </ul>
                        <a href="#contact" class="btn-premium btn-premium-outline w-100" x-text="t('btn_whatsapp')"></a>
                    </div>
                </div>

                <!-- 3 Days -->
                <div class="col-lg-4" data-aos="fade-up" data-aos-delay="100">
                    <div class="glass-card pricing-card featured h-100">
                        <div class="gold-gradient text-white py-1 px-3 rounded-pill d-inline-block mb-3 small fw-bold">BEST DEAL</div>
                        <h4 class="fw-bold mb-2" x-text="t('price_3days')"></h4>
                        <div class="price"><span class="text-gold">500</span> <small class="fs-6 text-muted fw-normal" x-text="t('price_day')"></small></div>
                        <p class="text-gold fw-bold mb-4" x-text="t('price_reduction')"></p>
                        <ul class="list-unstyled mb-5 text-start d-inline-block mx-auto">
                            <li class="mb-3"><i data-lucide="check" class="text-gold me-2"></i> <span x-text="t('pricing_full_insurance')"></span></li>
                            <li class="mb-3"><i data-lucide="check" class="text-gold me-2"></i> <span x-text="t('pricing_unlimited_km')"></span></li>
                            <li class="mb-3"><i data-lucide="check" class="text-gold me-2"></i> <span x-text="t('pricing_support_24')"></span></li>
                            <li><i data-lucide="gift" class="text-gold me-2"></i> <span class="fw-bold" x-text="t('pricing_free_gps')"></span></li>
                        </ul>
                        <a href="#contact" class="btn-premium btn-premium-gold w-100" x-text="t('btn_whatsapp')"></a>
                    </div>
                </div>

                <!-- 5 Days -->
                <div class="col-lg-4" data-aos="fade-up" data-aos-delay="200">
                    <div class="glass-card pricing-card h-100">
                        <div class="bg-info text-white py-1 px-3 rounded-pill d-inline-block mb-3 small fw-bold">PROMO</div>
                        <h4 class="fw-bold mb-2" x-text="t('price_5days')"></h4>
                        <h5 class="text-gold fw-bold mb-3" x-text="t('price_6day_free')"></h5>
                        <div class="price"><span class="text-gold">1400</span> <small class="fs-6 text-muted fw-normal" x-text="t('price_day')"></small></div>
                        <ul class="list-unstyled mb-5 text-start d-inline-block mx-auto">
                            <li class="mb-3"><i data-lucide="check" class="text-gold me-2"></i> <span x-text="t('pricing_full_insurance')"></span></li>
                            <li class="mb-3"><i data-lucide="check" class="text-gold me-2"></i> <span x-text="t('pricing_unlimited_km')"></span></li>
                            <li class="mb-3"><i data-lucide="check" class="text-gold me-2"></i> <span x-text="t('pricing_support_24')"></span></li>
                            <li><i data-lucide="gift" class="text-gold me-2"></i> <span class="fw-bold" x-text="t('pricing_free_gps')"></span></li>
                        </ul>
                        <a href="#contact" class="btn-premium btn-premium-outline w-100" x-text="t('btn_whatsapp')"></a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Locations -->
    <section id="locations" class="py-section bg-light">
        <div class="container">
            <div class="text-center mb-5" data-aos="fade-up">
                <h6 class="text-gold text-uppercase fw-bold mb-3" x-text="t('nav_locations')"></h6>
                <h2 class="display-4 mb-4" x-html="t('locations_title')"></h2>
                <p class="text-muted" x-text="t('loc_desc')"></p>
            </div>
            <div class="row g-4">
                <div class="col-md-6" data-aos="fade-right">
                    <div class="glass-card p-4 d-flex align-items-center gap-4">
                        <div class="gold-gradient p-4 rounded-lg text-white">
                            <i data-lucide="map-pin" style="width: 32px; height: 32px;"></i>
                        </div>
                        <div>
                            <h4 class="fw-bold" x-text="t('loc_eljadida')"></h4>
                            <p class="text-muted mb-3">Centre-ville, El Jadida, Maroc</p>
                            <a href="#" class="text-gold fw-bold text-decoration-none">
                                <span>Google Maps</span>
                                <i data-lucide="external-link" class="ms-1" style="width: 14px; height: 14px;"></i>
                            </a>
                        </div>
                    </div>
                </div>
                <div class="col-md-6" data-aos="fade-left">
                    <div class="glass-card p-4 d-flex align-items-center gap-4">
                        <div class="gold-gradient p-4 rounded-lg text-white">
                            <i data-lucide="map-pin" style="width: 32px; height: 32px;"></i>
                        </div>
                        <div>
                            <h4 class="fw-bold" x-text="t('loc_zemamra')"></h4>
                            <p class="text-muted mb-3">Avenue Hassan II, Zemamra, Maroc</p>
                            <a href="#" class="text-gold fw-bold text-decoration-none">
                                <span>Google Maps</span>
                                <i data-lucide="external-link" class="ms-1" style="width: 14px; height: 14px;"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Contact -->
    <section id="contact" class="py-section">
        <div class="container">
            <div class="row g-5">
                <div class="col-lg-5" data-aos="fade-up">
                    <h6 class="text-gold text-uppercase fw-bold mb-3" x-text="t('nav_contact')"></h6>
                    <h2 class="display-4 mb-4" x-html="t('contact_title')"></h2>
                    <p class="text-muted mb-5" x-text="t('contact_desc')"></p>
                    
                    <div class="d-flex flex-column gap-4">
                        <div class="d-flex align-items-center gap-4">
                            <div class="gold-gradient p-3 rounded-circle text-white">
                                <i data-lucide="phone"></i>
                            </div>
                            <div>
                                <span class="d-block small text-muted text-uppercase fw-bold">Appelez-nous</span>
                                <span class="fw-bold fs-5" x-text="phoneFormatted"></span>
                            </div>
                        </div>
                        <div class="d-flex align-items-center gap-4">
                            <div class="gold-gradient p-3 rounded-circle text-white">
                                <i data-lucide="message-circle"></i>
                            </div>
                            <div>
                                <span class="d-block small text-muted text-uppercase fw-bold">WhatsApp</span>
                                <a :href="'https://wa.me/' + phone.replace('+', '')" class="text-main fw-bold fs-5 text-decoration-none" x-text="phoneFormatted"></a>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-lg-7" data-aos="fade-up" data-aos-delay="200">
                    <div class="glass-card p-5">
                        <form class="row g-4 cform" id="contactForm" action="https://formsubmit.co/abdellah17lambaraa@gmail.com" method="POST" @submit.prevent="hdSend">
                            <input type="hidden" name="_captcha" value="false">
                            <input type="hidden" name="_template" value="table">
                            <div class="col-md-6">
                                <label class="form-label small text-uppercase fw-bold" x-text="t('label_name')"></label>
                                <input type="text" name="name" class="form-control form-control-lg" :placeholder="t('label_name')" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small text-uppercase fw-bold" x-text="t('label_email')"></label>
                                <input type="email" name="email" class="form-control form-control-lg" placeholder="example@mail.com" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label small text-uppercase fw-bold" x-text="t('label_message')"></label>
                                <textarea name="message" class="form-control" rows="5" :placeholder="t('label_message')" required></textarea>
                            </div>
                            <div class="col-12">
                                <button type="submit" class="btn-premium btn-premium-gold w-100 py-3" x-text="t('btn_send')"></button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="py-5 bg-dark text-white">
        <div class="container">
            <div class="row align-items-center mb-5">
                <div class="col-md-4 text-center text-md-start mb-4 mb-md-0">
                    <span class="fw-bold fs-4">Aziz<span class="text-gold">Stars</span>Cars</span>
                </div>
                <div class="col-md-8 text-center text-md-end">
                    <div class="d-flex flex-wrap justify-content-center justify-content-md-end gap-4">
                        <a href="#home" class="text-white text-decoration-none opacity-50" x-text="t('nav_home')"></a>
                        <a href="#about" class="text-white text-decoration-none opacity-50" x-text="t('nav_about')"></a>
                        <a href="#cars" class="text-white text-decoration-none opacity-50" x-text="t('nav_cars')"></a>
                        <a href="#contact" class="text-white text-decoration-none opacity-50" x-text="t('nav_contact')"></a>
                    </div>
                </div>
            </div>
            <hr class="opacity-10 mb-5">
            <div class="text-center">
                <p class="small opacity-50 mb-0" x-html="t('footer_copy')"></p>
            </div>
        </div>
    </footer>

    <!-- Floating WhatsApp Button -->
    <a :href="'https://wa.me/' + phone.replace('+', '') + '?text=' + encodeURIComponent(t('whatsapp_msg'))" 
       target="_blank" 
       class="whatsapp-float d-flex align-items-center justify-content-center shadow-lg" 
       title="WhatsApp">
        <i data-lucide="message-circle" class="text-white" style="width: 32px; height: 32px;"></i>
    </a>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            lucide.createIcons();
        });
    </script>
</body>

</html>
